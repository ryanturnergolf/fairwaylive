name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://ci.clubhouse-hq.example
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate CI Supabase configuration
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_SUPABASE_URL}" ]]; then
            echo "::error::Missing required GitHub Actions secret: NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi

          if [[ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]]; then
            echo "::error::Missing required GitHub Actions secret: NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          if [[ ! "${NEXT_PUBLIC_SUPABASE_URL}" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL must be a valid hosted Supabase project URL."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
